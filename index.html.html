<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이모지 대환장 서바이벌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111827; /* Tailwind gray-900 */
            color: white;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; /* Prevent scroll on touch */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Custom UI Animations */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-anim {
            animation: pop 0.3s ease-out forwards;
        }
        #ui-layer {
            pointer-events: none; /* Let clicks pass through to canvas if needed, though we use global events */
        }
        .pointer-events-auto {
            pointer-events: auto;
        }
    </style>
</head>
<body class="relative">

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between p-4 z-10">
        
        <!-- Top HUD: Health & Stats -->
        <div id="hud" class="hidden flex-col gap-2">
            <div class="flex justify-between items-center bg-gray-800 bg-opacity-70 p-2 rounded-lg backdrop-blur-sm border border-gray-700">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">❤️</span>
                    <div class="w-32 md:w-48 h-4 bg-gray-700 rounded-full overflow-hidden">
                        <div id="hp-bar" class="h-full bg-red-500 transition-all duration-200" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="text-lg font-bold text-yellow-400">
                    🏆 점수: <span id="score-display">0</span>
                </div>
            </div>
            <div id="level-display" class="text-xl font-bold text-white drop-shadow-md">
                Lv. 1
            </div>
        </div>

        <!-- Bottom HUD: EXP Bar -->
        <div id="exp-container" class="hidden w-full h-4 bg-gray-800 rounded-full overflow-hidden border border-gray-700 mt-auto mb-2">
            <div id="exp-bar" class="h-full bg-blue-500 transition-all duration-200" style="width: 0%;"></div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-80 z-50 pointer-events-auto">
        <div class="bg-gray-800 p-8 rounded-2xl text-center shadow-2xl pop-anim border border-gray-600 max-w-sm w-full mx-4">
            <h1 class="text-4xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-500">
                이모지 대환장<br>서바이벌
            </h1>
            <p class="text-gray-300 mb-6 text-sm">
                😎 마우스(또는 터치)를 따라 이동합니다.<br>
                🔥 공격은 자동으로 발사됩니다.<br>
                💎 보석을 모아 강력해지세요!
            </p>
            <button id="start-btn" class="w-full py-3 bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white font-bold rounded-xl text-xl transition-transform transform hover:scale-105 active:scale-95 shadow-lg">
                게임 시작!
            </button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-red-900 bg-opacity-90 z-50 pointer-events-auto">
        <div class="bg-gray-800 p-8 rounded-2xl text-center shadow-2xl border border-red-500 max-w-sm w-full mx-4">
            <h1 class="text-5xl font-black mb-2 text-white drop-shadow-[0_0_10px_rgba(255,0,0,0.8)]">
                💀 쥬금 💀
            </h1>
            <div class="text-2xl text-yellow-400 font-bold mb-4">
                최종 점수: <span id="final-score">0</span>
            </div>
            <div class="text-lg text-blue-300 font-bold mb-6">
                도달 레벨: <span id="final-level">1</span>
            </div>
            <button id="restart-btn" class="w-full py-3 bg-white text-red-600 hover:bg-gray-200 font-black rounded-xl text-xl transition-transform transform hover:scale-105 active:scale-95 shadow-lg">
                다시 도전하기
            </button>
        </div>
    </div>

    <script>
        /**
         * Game Configuration & State
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const hud = document.getElementById('hud');
        const expContainer = document.getElementById('exp-container');
        const hpBar = document.getElementById('hp-bar');
        const expBar = document.getElementById('exp-bar');
        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const finalLevelDisplay = document.getElementById('final-level');

        // Game State Variables
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let animationFrameId;
        let lastTime = 0;
        let score = 0;
        let gameTime = 0; // seconds

        // Resize Canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Tracking
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        
        function updateMousePos(e) {
            if(gameState !== 'PLAYING') return;
            if (e.touches && e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            } else {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            }
        }
        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('touchmove', updateMousePos, { passive: false });
        // Prevent default touch behaviors like scrolling while playing
        document.body.addEventListener('touchmove', function(e) {
            if (gameState === 'PLAYING') {
                e.preventDefault();
            }
        }, { passive: false });


        /**
         * Game Entities
         */
        let player;
        let enemies = [];
        let projectiles = [];
        let gems = [];
        let particles = [];
        let floatingTexts = [];

        const ENEMY_TYPES = ['🧟', '🦇', '👻', '👾', '👿'];

        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 30; // Font size approx
                this.emoji = '😎';
                this.speed = 4;
                
                // Stats
                this.maxHp = 100;
                this.hp = this.maxHp;
                this.level = 1;
                this.exp = 0;
                this.maxExp = 10;
                
                // Combat
                this.fireTimer = 0;
                this.fireRate = 0.5; // seconds between shots
                this.projSpeed = 8;
                this.projDamage = 10;
                this.multiShot = 1;
                
                // Visual
                this.hurtTimer = 0;
            }

            update(dt) {
                // Move smoothly towards mouse
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.hypot(dx, dy);
                
                if (dist > this.speed) {
                    this.x += (dx / dist) * this.speed * (dt * 60);
                    this.y += (dy / dist) * this.speed * (dt * 60);
                } else {
                    this.x = mouse.x;
                    this.y = mouse.y;
                }

                // Constrain to screen
                this.x = Math.max(this.size, Math.min(canvas.width - this.size, this.x));
                this.y = Math.max(this.size, Math.min(canvas.height - this.size, this.y));

                // Magnet gems
                const magnetRadius = 150 + (this.level * 10);
                gems.forEach(gem => {
                    const gx = gem.x - this.x;
                    const gy = gem.y - this.y;
                    const gDist = Math.hypot(gx, gy);
                    if (gDist < magnetRadius) {
                        gem.x -= (gx / gDist) * 10 * (dt * 60);
                        gem.y -= (gy / gDist) * 10 * (dt * 60);
                    }
                });

                // Auto Shooting
                this.fireTimer -= dt;
                if (this.fireTimer <= 0) {
                    this.shoot();
                    this.fireTimer = this.fireRate;
                }

                if (this.hurtTimer > 0) this.hurtTimer -= dt;
            }

            shoot() {
                if (enemies.length === 0) return;

                // Find nearest enemy
                let nearest = null;
                let minDist = Infinity;
                enemies.forEach(e => {
                    const dist = Math.hypot(e.x - this.x, e.y - this.y);
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = e;
                    }
                });

                if (nearest) {
                    const angleToTarget = Math.atan2(nearest.y - this.y, nearest.x - this.x);
                    
                    // Spread logic
                    const spreadAngle = 0.2; 
                    const startAngle = angleToTarget - (spreadAngle * (this.multiShot - 1)) / 2;

                    for (let i = 0; i < this.multiShot; i++) {
                        const angle = startAngle + (spreadAngle * i);
                        projectiles.push(new Projectile(this.x, this.y, angle, this.projSpeed, this.projDamage, '🔥'));
                    }
                }
            }

            takeDamage(amount) {
                if (this.hurtTimer > 0) return; // Invincibility frames
                this.hp -= amount;
                this.hurtTimer = 0.5;
                createParticles(this.x, this.y, '🩸', 5);
                updateHUD();

                // Screen shake effect (simple)
                ctx.save();
                ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
                setTimeout(() => ctx.restore(), 50);

                if (this.hp <= 0) {
                    gameOver();
                }
            }

            gainExp(amount) {
                this.exp += amount;
                if (this.exp >= this.maxExp) {
                    this.levelUp();
                }
                updateHUD();
            }

            levelUp() {
                this.level++;
                this.exp -= this.maxExp;
                this.maxExp = Math.floor(this.maxExp * 1.5);
                
                // Heal a bit
                this.hp = Math.min(this.maxHp, this.hp + 20);

                // Upgrade stats based on level thresholds
                if (this.level % 3 === 0) this.multiShot++;
                if (this.fireRate > 0.1) this.fireRate -= 0.05;
                this.projDamage += 2;
                
                createFloatingText(this.x, this.y - 40, "LEVEL UP!", '#fbbf24', 30);
                createParticles(this.x, this.y, '✨', 10, 5);
            }

            draw() {
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.save();
                if (this.hurtTimer > 0) {
                    // Flash red
                    ctx.globalAlpha = 0.5;
                }
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        class Enemy {
            constructor(x, y, hp, speed, emoji) {
                this.x = x;
                this.y = y;
                this.size = 25;
                this.hp = hp;
                this.maxHp = hp;
                this.speed = speed;
                this.emoji = emoji;
                this.damage = 10;
                
                // Wobble effect
                this.wobbleOffset = Math.random() * Math.PI * 2;
            }

            update(dt) {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.hypot(dx, dy);
                
                // Move towards player
                if (dist > 0) {
                    this.x += (dx / dist) * this.speed * (dt * 60);
                    this.y += (dy / dist) * this.speed * (dt * 60);
                }

                // Collision with player
                if (dist < (this.size/2 + player.size/2)) {
                    player.takeDamage(this.damage);
                }
            }

            takeDamage(amount) {
                this.hp -= amount;
                createFloatingText(this.x, this.y, `-${amount}`, '#ef4444');
                createParticles(this.x, this.y, '💨', 2);
                
                if (this.hp <= 0) {
                    this.die();
                    return true; // Dead
                }
                return false;
            }

            die() {
                score += 10;
                updateHUD();
                createParticles(this.x, this.y, '💀', 3);
                // Drop gem (80% chance)
                if (Math.random() < 0.8) {
                    gems.push(new Gem(this.x, this.y, 1 + Math.floor(gameTime / 30)));
                }
            }

            draw() {
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Wobble animation
                const wobble = Math.sin(Date.now() / 200 + this.wobbleOffset) * 5;
                
                ctx.save();
                ctx.translate(this.x, this.y + wobble);
                
                // Direction facing
                if (player.x < this.x) {
                    ctx.scale(-1, 1);
                }
                
                ctx.fillText(this.emoji, 0, 0);
                
                // Small HP bar
                if (this.hp < this.maxHp) {
                    ctx.fillStyle = 'red';
                    ctx.fillRect(-10, -20, 20 * (this.hp/this.maxHp), 3);
                }
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle, speed, damage, emoji) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.damage = damage;
                this.emoji = emoji;
                this.size = 20;
                this.life = 2; // seconds
            }

            update(dt) {
                this.x += this.vx * (dt * 60);
                this.y += this.vy * (dt * 60);
                this.life -= dt;
            }

            draw() {
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Rotate based on velocity
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.vy, this.vx));
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        class Gem {
            constructor(x, y, expValue) {
                this.x = x + (Math.random() - 0.5) * 20;
                this.y = y + (Math.random() - 0.5) * 20;
                this.expValue = expValue;
                this.size = 15;
                // Different colors based on exp value
                this.emoji = expValue > 3 ? '💎' : '🔹';
                this.bobOffset = Math.random() * Math.PI * 2;
            }

            update(dt) {
                // Collection collision
                const dist = Math.hypot(this.x - player.x, this.y - player.y);
                if (dist < (this.size/2 + player.size/2)) {
                    player.gainExp(this.expValue);
                    createParticles(this.x, this.y, '✨', 2);
                    return true; // Collected
                }
                return false;
            }

            draw() {
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const bob = Math.sin(Date.now() / 300 + this.bobOffset) * 3;
                
                ctx.fillText(this.emoji, this.x, this.y + bob);
            }
        }

        class Particle {
            constructor(x, y, emoji, speedBase) {
                this.x = x;
                this.y = y;
                this.emoji = emoji;
                const angle = Math.random() * Math.PI * 2;
                const speed = speedBase * (0.5 + Math.random());
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1;
                this.maxLife = 1;
                this.size = 10 + Math.random() * 10;
            }

            update(dt) {
                this.x += this.vx * (dt * 60);
                this.y += this.vy * (dt * 60);
                this.life -= dt * 2; // fade fast
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color, size=20) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.size = size;
                this.life = 1.0;
                this.vy = -1 - Math.random();
                this.vx = (Math.random() - 0.5);
            }

            update(dt) {
                this.x += this.vx * (dt * 60);
                this.y += this.vy * (dt * 60);
                this.life -= dt;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = `bold ${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillStyle = this.color;
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        /**
         * Helpers & Spawning
         */
        function createParticles(x, y, emoji, count, speed=3) {
            for(let i=0; i<count; i++) {
                particles.push(new Particle(x, y, emoji, speed));
            }
        }

        function createFloatingText(x, y, text, color, size) {
            floatingTexts.push(new FloatingText(x, y, text, color, size));
        }

        let spawnTimer = 0;
        function spawnEnemies(dt) {
            // Difficulty increases over time
            const baseSpawnRate = 1.5; // seconds
            const spawnRate = Math.max(0.2, baseSpawnRate - (gameTime * 0.01)); // gets faster
            
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnTimer = spawnRate;
                
                // Spawn quantity increases
                const spawnCount = 1 + Math.floor(gameTime / 15);
                
                for(let i=0; i<spawnCount; i++) {
                    // Spawn outside screen
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.max(canvas.width, canvas.height) / 2 + 50;
                    const sx = player.x + Math.cos(angle) * dist;
                    const sy = player.y + Math.sin(angle) * dist;
                    
                    // Enemy scaling
                    const typeIdx = Math.min(ENEMY_TYPES.length - 1, Math.floor(Math.random() * (1 + gameTime/30)));
                    const hp = 10 + (gameTime * 0.5);
                    const speed = 1.5 + Math.random() * 1.5 + (gameTime * 0.01);
                    
                    enemies.push(new Enemy(sx, sy, hp, speed, ENEMY_TYPES[typeIdx]));
                }
            }
        }

        function updateHUD() {
            hpBar.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
            expBar.style.width = `${(player.exp / player.maxExp) * 100}%`;
            scoreDisplay.innerText = score;
            levelDisplay.innerText = `Lv. ${player.level}`;
        }

        /**
         * Game Loop & Core Logic
         */
        function initGame() {
            player = new Player(canvas.width/2, canvas.height/2);
            enemies = [];
            projectiles = [];
            gems = [];
            particles = [];
            floatingTexts = [];
            score = 0;
            gameTime = 0;
            lastTime = performance.now();
            updateHUD();
            
            hud.classList.remove('hidden');
            hud.classList.add('flex');
            expContainer.classList.remove('hidden');
            
            mouse.x = canvas.width/2;
            mouse.y = canvas.height/2;
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            hud.classList.add('hidden');
            hud.classList.remove('flex');
            expContainer.classList.add('hidden');
            
            finalScoreDisplay.innerText = score;
            finalLevelDisplay.innerText = player.level;
            
            gameOverScreen.classList.remove('hidden');
        }

        function update(dt) {
            gameTime += dt;
            
            player.update(dt);
            spawnEnemies(dt);

            // Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.update(dt);
                
                let destroyed = false;
                
                // Collision with enemies
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    const dist = Math.hypot(p.x - e.x, p.y - e.y);
                    if (dist < (p.size/2 + e.size/2)) {
                        if (e.takeDamage(p.damage)) {
                            enemies.splice(j, 1);
                        }
                        destroyed = true;
                        createParticles(p.x, p.y, '💥', 3, 2);
                        break; // Proj dies on first hit
                    }
                }

                if (destroyed || p.life <= 0 || 
                    p.x < -100 || p.x > canvas.width + 100 || 
                    p.y < -100 || p.y > canvas.height + 100) {
                    projectiles.splice(i, 1);
                }
            }

            // Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update(dt);
            }

            // Update Gems
            for (let i = gems.length - 1; i >= 0; i--) {
                if (gems[i].update(dt)) {
                    gems.splice(i, 1);
                }
            }

            // Update Particles & Text
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update(dt);
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }
        }

        function draw() {
            // Background clearing (slight trail effect)
            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid pattern (subtle)
            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 1;
            const gridSize = 50;
            const offsetX = (player.x * -0.5) % gridSize;
            const offsetY = (player.y * -0.5) % gridSize;
            
            ctx.beginPath();
            for(let x = offsetX - gridSize; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for(let y = offsetY - gridSize; y < canvas.height; y += gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Draw entities
            gems.forEach(g => g.draw());
            enemies.forEach(e => e.draw());
            projectiles.forEach(p => p.draw());
            player.draw();
            particles.forEach(p => p.draw());
            floatingTexts.forEach(t => t.draw());
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') {
                lastTime = timestamp;
                animationFrameId = requestAnimationFrame(gameLoop);
                return;
            }

            // Calculate Delta Time (cap to max 0.1s to prevent huge jumps on tab switch)
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = timestamp;

            update(dt);
            draw();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        /**
         * Event Listeners
         */
        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            initGame();
            gameState = 'PLAYING';
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
            gameState = 'PLAYING';
        });

        // Start Loop
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
